# Source system: a Postgres "order management system" (OMS) database.
services:
  postgres:
    image: postgres:16
    container_name: supply_source_db
    environment:
      POSTGRES_USER: ${PG_USER:-de_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-de_pass}
      POSTGRES_DB: ${PG_DB:-supply}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-de_user} -d ${PG_DB:-supply}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
